---
# Shared PostgreSQL server for homelab apps. Each app gets its own role and database on
# it (standalone DatabaseRole + Database CRs, see dtrack/) rather than its own Cluster.
# Standalone CRs over Cluster.spec.managed.roles: no shared-spec edit per app, and CNPG
# treats a role declared in both places as a conflict (inline spec wins, CR reports it).
#
# Apps connect to postgres-rw.databases.svc.cluster.local:5432 (read-write, always the
# primary). postgres-ro / postgres-r exist too but only matter once instances > 1.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres
  namespace: databases
spec:
  # No bootstrap block: initdb creates a database and owner both named "app" (credentials
  # in Secret postgres-app). Apps don't use it; they get their own via DatabaseRole CRs.
  #
  # One instance: the iSCSI volume follows the pod to any node, so a node loss or drain
  # costs a restart (~30-60s), not the data. Raise to 2 for a streaming replica with
  # failover in seconds, at the cost of a second LUN and twice the memory.
  instances: 1
  # Renovate tracks this through the imageName custom manager in renovate.json5. Minor
  # bumps (18.x) automerge and restart the pod; a major bump is an offline pg_upgrade and
  # stays manual.
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6-standard-trixie@sha256:5bf4a23aa13fb560903fba932676773ba4ba2729c162e587b09bf539a2e3df56
  # With a single instance the default PDB (minAvailable 1 on the primary) can never be
  # satisfied, so it would block `kubectl drain` (restart-cluster-nodes) indefinitely.
  # Without it the pod is evicted and the operator recreates it on another node with the
  # same PVC.
  enablePDB: false
  primaryUpdateStrategy: unsupervised
  storage:
    storageClass: synology-iscsi
    size: 10Gi # allowVolumeExpansion is on: raise it here to grow the LUN online
  postgresql:
    parameters:
      # ~25% of the memory limit
      shared_buffers: 256MB
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      memory: 1Gi
