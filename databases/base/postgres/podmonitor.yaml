---
# Per-instance Postgres metrics (cnpg_* on port 9187), which the CloudNativePG Grafana
# dashboard is built on. Written by hand: Cluster.spec.monitoring.enablePodMonitor is
# deprecated upstream.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: postgres
  namespace: databases
  labels:
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      cnpg.io/cluster: postgres
      cnpg.io/podRole: instance
  podMetricsEndpoints:
    - port: metrics
