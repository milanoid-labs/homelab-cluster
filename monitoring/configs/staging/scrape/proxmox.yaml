---
# node_exporter on the Proxmox host (outside the k3s cluster), installed by hand;
# see scripts/proxmox/README.md. Prometheus selects ScrapeConfigs by the release label.
apiVersion: monitoring.coreos.com/v1alpha1
kind: ScrapeConfig
metadata:
  name: proxmox-node-exporter
  labels:
    release: kube-prometheus-stack
spec:
  scrapeInterval: 30s
  staticConfigs:
    - targets:
        - 192.168.1.200:9100
      labels:
        host: proxmox
  # Stable instance name for the dashboard instead of IP:port
  relabelings:
    - targetLabel: instance
      replacement: proxmox
