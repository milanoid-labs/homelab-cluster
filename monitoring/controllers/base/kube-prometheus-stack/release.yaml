---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: monitoring
spec:
  interval: 30m
  chart:
    spec:
      chart: kube-prometheus-stack
      version: "91.8.1"
      sourceRef:
        kind: HelmRepository
        name: kube-prometheus-stack
        namespace: monitoring
      interval: 12h
  install:
    crds: Create
  upgrade:
    crds: CreateReplace
  driftDetection:
    mode: enabled
    ignore:
      # Ignore "validated" annotation which is not inserted during install
      - paths: ["/metadata/annotations/prometheus-operator-validated"]
        target:
          kind: PrometheusRule
  values:
    # to see all possible values run `helm show values prometheus-community/kube-prometheus-stack`
    # Resource requests/limits below: sized from live usage observed 2026-08-28
    # (all monitoring pods were BestEffort before this — no requests/limits at all).
    # Treat as a first pass; revisit once a week of persisted metrics history
    # exists, same method as commit 5ddf7c1 used for app pods.
    prometheus:
      prometheusSpec:
        # Explicit rather than relying on the chart default, since retention
        # is meaningless without the persistent storage below.
        retention: 10d
        resources:
          requests:
            cpu: 50m
            memory: 512Mi
          limits:
            memory: 900Mi
        storageSpec:
          volumeClaimTemplate:
            spec:
              storageClassName: local-path
              accessModes: ["ReadWriteOnce"]
              resources:
                requests:
                  storage: 8Gi
      ingress:
        enabled: true
        ingressClassName: traefik
        hosts:
          - prometheus.milanoid.net
    alertmanager:
      alertmanagerSpec:
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            memory: 128Mi
        storage:
          volumeClaimTemplate:
            spec:
              storageClassName: local-path
              accessModes: ["ReadWriteOnce"]
              resources:
                requests:
                  storage: 1Gi
        # SOPS-encrypted Secret from monitoring/configs/staging/kube-prometheus-stack/,
        # mounted at /etc/alertmanager/secrets/alertmanager-telegram/
        secrets:
          - alertmanager-telegram
      # Replaces the chart's default config entirely, so the Watchdog -> "null"
      # route and the default inhibit_rules are carried over explicitly.
      config:
        global:
          resolve_timeout: 5m
        route:
          receiver: telegram.bot
          group_by: [alertname]
          group_wait: 30s
          group_interval: 5m
          repeat_interval: 12h
          routes:
            # Watchdog always fires (dead man's switch); don't page on it
            - receiver: "null"
              matchers:
                - alertname = "Watchdog"
        inhibit_rules:
          - source_matchers:
              - severity = critical
            target_matchers:
              - severity =~ warning|info
            equal: [namespace, alertname]
          - source_matchers:
              - severity = warning
            target_matchers:
              - severity = info
            equal: [namespace, alertname]
          - source_matchers:
              - alertname = InfoInhibitor
            target_matchers:
              - severity = info
            equal: [namespace]
          - target_matchers:
              - alertname = InfoInhibitor
        receivers:
          - name: "null"
          - name: telegram.bot
            telegram_configs:
              - bot_token_file: /etc/alertmanager/secrets/alertmanager-telegram/bot-token
                chat_id: 110919235
                parse_mode: HTML
                message: |
                  {{ range .Alerts }}
                  <b>{{ .Labels.alertname }}</b>
                  {{ .Annotations.summary }}
                  {{ end }}
        templates:
          - /etc/alertmanager/config/*.tmpl
    prometheusOperator:
      resources:
        requests:
          cpu: 10m
          memory: 48Mi
        limits:
          memory: 128Mi
    kube-state-metrics:
      resources:
        requests:
          cpu: 5m
          memory: 32Mi
        limits:
          memory: 96Mi
      # Export the Ready condition of Flux objects as gotk_resource_info, the metric the
      # Flux Grafana dashboards and the FluxReconciliationFailure alert are built on.
      # Adapted from fluxcd/flux2-monitoring-example, minus its `collectors: []` and
      # `--custom-resource-state-only`, which would switch off the standard metrics
      # (kube_pod_*, kube_deployment_*, ...) that the default alerts depend on.
      # Covers every installed Flux kind that has a Ready condition (checked against the
      # 11 *.toolkit.fluxcd.io CRDs in the cluster). Image automation is left out (its
      # CRDs aren't installed), and so are Alert and Provider (v1beta3 kinds with no
      # status at all, so the alert could never use them).
      rbac:
        extraRules:
          - apiGroups:
              - source.toolkit.fluxcd.io
              - kustomize.toolkit.fluxcd.io
              - helm.toolkit.fluxcd.io
              - notification.toolkit.fluxcd.io
            resources:
              - gitrepositories
              - buckets
              - externalartifacts
              - helmrepositories
              - helmcharts
              - ocirepositories
              - kustomizations
              - helmreleases
              - receivers
            verbs: ["list", "watch"]
      customResourceState:
        enabled: true
        config:
          spec:
            resources:
              - groupVersionKind:
                  group: kustomize.toolkit.fluxcd.io
                  version: v1
                  kind: Kustomization
                metricNamePrefix: gotk
                metrics:
                  - name: resource_info
                    help: The current state of a Flux Kustomization resource.
                    each:
                      type: Info
                      info:
                        labelsFromPath:
                          name: [metadata, name]
                    labelsFromPath:
                      exported_namespace: [metadata, namespace]
                      ready: [status, conditions, "[type=Ready]", status]
                      suspended: [spec, suspend]
                      revision: [status, lastAppliedRevision]
                      source_name: [spec, sourceRef, name]
              - groupVersionKind:
                  group: helm.toolkit.fluxcd.io
                  version: v2
                  kind: HelmRelease
                metricNamePrefix: gotk
                metrics:
                  - name: resource_info
                    help: The current state of a Flux HelmRelease resource.
                    each:
                      type: Info
                      info:
                        labelsFromPath:
                          name: [metadata, name]
                    labelsFromPath:
                      exported_namespace: [metadata, namespace]
                      ready: [status, conditions, "[type=Ready]", status]
                      suspended: [spec, suspend]
                      revision: [status, history, "0", chartVersion]
                      chart_name: [status, history, "0", chartName]
                      chart_app_version: [status, history, "0", appVersion]
                      chart_source_name: [spec, chart, spec, sourceRef, name]
              - groupVersionKind:
                  group: source.toolkit.fluxcd.io
                  version: v1
                  kind: GitRepository
                metricNamePrefix: gotk
                metrics:
                  - name: resource_info
                    help: The current state of a Flux GitRepository resource.
                    each:
                      type: Info
                      info:
                        labelsFromPath:
                          name: [metadata, name]
                    labelsFromPath:
                      exported_namespace: [metadata, namespace]
                      ready: [status, conditions, "[type=Ready]", status]
                      suspended: [spec, suspend]
                      revision: [status, artifact, revision]
                      url: [spec, url]
              - groupVersionKind:
                  group: source.toolkit.fluxcd.io
                  version: v1
                  kind: HelmRepository
                metricNamePrefix: gotk
                metrics:
                  - name: resource_info
                    help: The current state of a Flux HelmRepository resource.
                    each:
                      type: Info
                      info:
                        labelsFromPath:
                          name: [metadata, name]
                    labelsFromPath:
                      exported_namespace: [metadata, namespace]
                      ready: [status, conditions, "[type=Ready]", status]
                      suspended: [spec, suspend]
                      revision: [status, artifact, revision]
                      url: [spec, url]
              - groupVersionKind:
                  group: source.toolkit.fluxcd.io
                  version: v1
                  kind: HelmChart
                metricNamePrefix: gotk
                metrics:
                  - name: resource_info
                    help: The current state of a Flux HelmChart resource.
                    each:
                      type: Info
                      info:
                        labelsFromPath:
                          name: [metadata, name]
                    labelsFromPath:
                      exported_namespace: [metadata, namespace]
                      ready: [status, conditions, "[type=Ready]", status]
                      suspended: [spec, suspend]
                      revision: [status, artifact, revision]
                      chart_name: [spec, chart]
                      chart_version: [spec, version]
              - groupVersionKind:
                  group: source.toolkit.fluxcd.io
                  version: v1
                  kind: OCIRepository
                metricNamePrefix: gotk
                metrics:
                  - name: resource_info
                    help: The current state of a Flux OCIRepository resource.
                    each:
                      type: Info
                      info:
                        labelsFromPath:
                          name: [metadata, name]
                    labelsFromPath:
                      exported_namespace: [metadata, namespace]
                      ready: [status, conditions, "[type=Ready]", status]
                      suspended: [spec, suspend]
                      revision: [status, artifact, revision]
                      url: [spec, url]
              - groupVersionKind:
                  group: source.toolkit.fluxcd.io
                  version: v1
                  kind: Bucket
                metricNamePrefix: gotk
                metrics:
                  - name: resource_info
                    help: The current state of a Flux Bucket resource.
                    each:
                      type: Info
                      info:
                        labelsFromPath:
                          name: [metadata, name]
                    labelsFromPath:
                      exported_namespace: [metadata, namespace]
                      ready: [status, conditions, "[type=Ready]", status]
                      suspended: [spec, suspend]
                      revision: [status, artifact, revision]
                      endpoint: [spec, endpoint]
                      bucket_name: [spec, bucketName]
              - groupVersionKind:
                  group: notification.toolkit.fluxcd.io
                  version: v1
                  kind: Receiver
                metricNamePrefix: gotk
                metrics:
                  - name: resource_info
                    help: The current state of a Flux Receiver resource.
                    each:
                      type: Info
                      info:
                        labelsFromPath:
                          name: [metadata, name]
                    labelsFromPath:
                      exported_namespace: [metadata, namespace]
                      ready: [status, conditions, "[type=Ready]", status]
                      suspended: [spec, suspend]
                      webhook_path: [status, webhookPath]
              # Produced by third-party controllers rather than Flux itself. No
              # spec.suspend on this kind, so no `suspended` label.
              - groupVersionKind:
                  group: source.toolkit.fluxcd.io
                  version: v1
                  kind: ExternalArtifact
                metricNamePrefix: gotk
                metrics:
                  - name: resource_info
                    help: The current state of a Flux ExternalArtifact resource.
                    each:
                      type: Info
                      info:
                        labelsFromPath:
                          name: [metadata, name]
                    labelsFromPath:
                      exported_namespace: [metadata, namespace]
                      ready: [status, conditions, "[type=Ready]", status]
                      revision: [status, artifact, revision]
                      source_name: [spec, sourceRef, name]
    prometheus-node-exporter:
      resources:
        requests:
          cpu: 5m
          memory: 24Mi
        limits:
          memory: 64Mi
    grafana:
      admin:
        existingSecret: grafana-admin-secret
        userKey: admin-user
        passwordKey: admin-password
      resources:
        requests:
          cpu: 20m
          memory: 192Mi
        limits:
          memory: 512Mi
      persistence:
        enabled: true
        type: pvc
        storageClassName: local-path
        accessModes: ["ReadWriteOnce"]
        size: 2Gi
      ingress:
        enabled: true
        ingressClassName: traefik
        hosts:
          - grafana.milanoid.net
        tls:
          - secretName: grafana-tls-secret
            hosts:
              - grafana.milanoid.net
      dashboardProviders:
        dashboardproviders.yaml:
          apiVersion: 1
          providers:
            - name: default
              orgId: 1
              folder: Homelab
              type: file
              disableDeletion: false
              options:
                path: /var/lib/grafana/dashboards/default
      dashboards:
        default:
          node-exporter-full:
            gnetId: 1860
            revision: 37
            datasource: Prometheus
          kubernetes-cluster:
            gnetId: 7249
            revision: 1
            datasource: Prometheus
          flux-cluster:
            url: https://raw.githubusercontent.com/fluxcd/flux2-monitoring-example/main/monitoring/configs/dashboards/cluster.json
            datasource: Prometheus
          flux-control-plane:
            url: https://raw.githubusercontent.com/fluxcd/flux2-monitoring-example/main/monitoring/configs/dashboards/control-plane.json
            datasource: Prometheus
