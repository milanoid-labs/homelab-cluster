---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pihole
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: pihole
  template:
    metadata:
      labels:
        app: pihole
    spec:
      nodeSelector:
        kubernetes.io/hostname: hpmini02
      dnsPolicy: None
      dnsConfig:
        nameservers:
          - 127.0.0.1
          - 8.8.8.8
      containers:
        - name: pihole
          image: pihole/pihole:2026.09.0@sha256:5b9c8cf51de7d6d3f2240dbe72baf5f06e1fd39cb4d77a99fab4fa13e23bd1be
          ports:
            - containerPort: 53
              protocol: TCP
              name: dns-tcp
            - containerPort: 53
              protocol: UDP
              name: dns-udp
            - containerPort: 80
              protocol: TCP
              name: http
          # Sized from 7d observed usage (p95 70Mi, max 71Mi). Requests matter most here:
          # without them pi-hole is BestEffort and is evicted first under node memory
          # pressure, which takes out DNS for the whole cluster.
          resources:
            requests:
              cpu: "50m"
              memory: "96Mi"
            limits:
              memory: "256Mi"
          env:
            - name: TZ
              value: Europe/Prague
            - name: FTLCONF_dns_upstreams
              value: "8.8.8.8;8.8.4.4"
            - name: FTLCONF_dns_listeningMode
              value: "ALL"
            - name: WEBPASSWORD
              valueFrom:
                secretKeyRef:
                  name: pihole-password
                  key: password
          volumeMounts:
            - name: pihole-data
              mountPath: /etc/pihole
            - name: dnsmasq-custom
              mountPath: /etc/dnsmasq.d/99-custom.conf
              subPath: 99-custom.conf
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            runAsUser: 0  # FTL manages /etc/pihole ownership and internal processes; pihole/pihole does not support non-root
            capabilities:
              add:
                - SYS_TIME
                - SYS_NICE
              drop:
                - NET_RAW
      volumes:
        - name: pihole-data
          persistentVolumeClaim:
            claimName: pihole
        - name: dnsmasq-custom
          configMap:
            name: pihole-dnsmasq-custom
