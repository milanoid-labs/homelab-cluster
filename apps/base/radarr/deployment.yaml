---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: radarr
spec:
  replicas: 1
  selector:
    matchLabels:
      app: radarr
  template:
    metadata:
      labels:
        app: radarr
    spec:
      containers:
        - name: radarr
          image: ghcr.io/hotio/radarr:release-6.4.4.10685@sha256:57194e206693793e94373ca9a5b498c16d0adf80086324c002183a0139393f7b
          envFrom:
            - configMapRef:
                name: radarr-configmap
          ports:
            - containerPort: 7878
              protocol: TCP
          # Sized from 7d observed usage (p95 245Mi, max 280Mi)
          resources:
            requests:
              cpu: "50m"
              memory: "256Mi"
            limits:
              memory: "512Mi"
          volumeMounts:
            - mountPath: /config
              name: radarr-config
              subPath: radarr/config
            - mountPath: /data
              name: radarr-data

      restartPolicy: Always
      volumes:
        - name: radarr-data
          persistentVolumeClaim:
            claimName: synology-nfs-pvc
        - name: radarr-config
          persistentVolumeClaim:
            claimName: radarr-config-pvc
