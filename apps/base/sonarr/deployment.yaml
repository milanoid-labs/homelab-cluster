---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sonarr
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sonarr
  template:
    metadata:
      labels:
        app: sonarr
    spec:
      containers:
        - name: sonarr
          image: ghcr.io/hotio/sonarr:release-4.0.20.3014@sha256:90c6edf86bafdb92344ad9fce0dc6098e9ddcc7e263e10787eb63b93951029f1
          envFrom:
            - configMapRef:
                name: sonarr-configmap
          ports:
            - containerPort: 8989
              protocol: TCP
          # Sized from 7d observed usage (p95 206Mi, max 226Mi)
          resources:
            requests:
              cpu: "50m"
              memory: "224Mi"
            limits:
              memory: "512Mi"
          volumeMounts:
            - mountPath: /config
              name: sonarr-config
              subPath: sonarr/config
            - mountPath: /data
              name: sonarr-data

      restartPolicy: Always
      volumes:
        - name: sonarr-data
          persistentVolumeClaim:
            claimName: synology-nfs-pvc
        - name: sonarr-config
          persistentVolumeClaim:
            claimName: sonarr-config-pvc
