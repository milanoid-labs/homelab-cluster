---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: webhosting
spec:
  replicas: 1
  selector:
    matchLabels:
      app: webhosting
  template:
    metadata:
      labels:
        app: webhosting
    spec:
      containers:
        - name: nginx
          image: nginx:1.31.3@sha256:8541484afbc9c8a5a8a99b379568ebbc957f658583ec9448fc43104229c03cf8
          ports:
            - containerPort: 80
          # Sized from 7d observed usage (p95 7Mi, max 7Mi) — static nginx, floor values
          resources:
            requests:
              cpu: "10m"
              memory: "32Mi"
            limits:
              memory: "128Mi"
          volumeMounts:
            - mountPath: /usr/share/nginx/html
              name: site
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            # No runAsUser: the stock nginx image needs root to bind :80 and to
            # write its pid/temp dirs. Switching to nginxinc/nginx-unprivileged
            # (listens on 8080) would let this run as non-root — separate change.
      volumes:
        # The page template and the class roster live in separate objects — the
        # roster is SOPS-encrypted because this repo is public — but nginx needs
        # them in one docroot. A projected volume merges them; subPath mounts
        # would not pick up later updates.
        - name: site
          projected:
            sources:
              - configMap:
                  name: webhosting-4b
              - secret:
                  name: webhosting-4b-roster
