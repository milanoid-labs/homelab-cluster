---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: torrent-client
spec:
  replicas: 1
  strategy:
    type: Recreate
    rollingUpdate: null
  selector:
    matchLabels:
      app: torrent-client
  template:
    metadata:
      labels:
        app: torrent-client
    spec:
      nodeSelector:
        kubernetes.io/hostname: hpmini01
      containers:
        - name: qbittorrent
          image: linuxserver/qbittorrent:113@sha256:6dc86c50de23768683915d023b9b13dc40e5c2f8157fda19d6becfa93f7b1ac8
          # Health checks to auto-restart if UI hangs
          startupProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 10
          # Sized from 7d observed usage: memory p95 840Mi / max 959Mi against the old 1Gi
          # limit, and CPU p95 143m against the old 500m limit. On 2026-08-24 this pod was
          # restarted by the liveness probe after 5 consecutive failures while memory sat at
          # ~1023Mi — not an OOM kill (container_oom_events_total stayed 0), but the web UI
          # stopped responding under combined memory and CPU-throttling pressure.
          resources:
            requests:
              memory: "768Mi"
              cpu: "300m"
            limits:
              memory: "1536Mi"
              cpu: "1500m"
          envFrom:
            - configMapRef:
                name: qbittorrent-configmap
          ports:
            - containerPort: 8080
              protocol: TCP
              name: web-ui
          volumeMounts:
            - mountPath: /data
              name: qbittorrent
            - mountPath: /config
              name: qbittorrent-config
      restartPolicy: Always
      volumes:
        - name: qbittorrent
          persistentVolumeClaim:
            claimName: synology-nfs-pvc
        - name: qbittorrent-config
          hostPath:
            path: /srv/qbittorrent/config
            type: DirectoryOrCreate
