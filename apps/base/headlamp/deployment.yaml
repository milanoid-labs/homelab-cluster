---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: headlamp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: headlamp
  template:
    metadata:
      labels:
        app: headlamp
    spec:
      serviceAccountName: headlamp
      containers:
        - name: headlamp
          image: ghcr.io/headlamp-k8s/headlamp:v0.45.0@sha256:f4a25c0f94b0e09b0ee79988bf65a7b32d4e67e8d91cf6949494a0e0b7c85944
          args: ["--in-cluster", "--port=4466"]
          env:
            - name: HEADLAMP_BACKEND_TOKEN
              valueFrom:
                secretKeyRef:
                  name: headlamp-token
                  key: token
          ports:
            - containerPort: 4466
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          securityContext:
            allowPrivilegeEscalation: false
            runAsUser: 100
