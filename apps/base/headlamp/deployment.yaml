---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: headlamp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: headlamp
  template:
    metadata:
      labels:
        app: headlamp
    spec:
      serviceAccountName: headlamp
      containers:
        - name: headlamp
          image: ghcr.io/headlamp-k8s/headlamp:v0.46.0@sha256:fcc6a6b011a8c0adbf4489384588442224c01f74b6f63739e50b089d54b98371
          args: ["--in-cluster", "--port=4466"]
          env:
            - name: HEADLAMP_BACKEND_TOKEN
              valueFrom:
                secretKeyRef:
                  name: headlamp-token
                  key: token
          ports:
            - containerPort: 4466
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          securityContext:
            allowPrivilegeEscalation: false
            runAsUser: 100
