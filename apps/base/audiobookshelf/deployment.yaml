---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: audiobookshelf
spec:
  replicas: 1
  selector:
    matchLabels:
      app: audiobookshelf
  template:
    metadata:
      labels:
        app: audiobookshelf
    spec:
      containers:
        - name: audiobookshelf
          image: ghcr.io/advplyr/audiobookshelf:2.36.1@sha256:3528a93b6442ffe54bd46771bbbab7c97084e1101071586d9dc2254f30bb4358
          envFrom:
            - configMapRef:
                name: audiobookshelf-configmap
          ports:
            - containerPort: 3005
              protocol: TCP
          # Sized from 7d observed usage (p95 60Mi, max 64Mi)
          resources:
            requests:
              cpu: "25m"
              memory: "64Mi"
            limits:
              memory: "192Mi"
          volumeMounts:
            - mountPath: /config
              name: audiobookshelf-config
            - mountPath: /audiobooks
              name: audiobookshelf-audiobooks
            - mountPath: /metadata
              name: audiobookshelf-metadata
          securityContext:
            allowPrivilegeEscalation: false
            runAsUser: 1000  # user `node`
      restartPolicy: Always
      volumes:
        - name: audiobookshelf-config
          persistentVolumeClaim:
            claimName: config-pvc
        - name: audiobookshelf-audiobooks
          persistentVolumeClaim:
            claimName: audiobooks-pvc
        - name: audiobookshelf-metadata
          persistentVolumeClaim:
            claimName: metadata-pvc
