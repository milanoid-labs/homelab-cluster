---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prowlarr
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prowlarr
  template:
    metadata:
      labels:
        app: prowlarr
    spec:
      containers:
        - name: prowlarr
          image: ghcr.io/hotio/prowlarr:release-2.7.0.5723@sha256:b6c12ae212f7a3d1e4012f19686e4d25cc04d9365e1e6a9054f171005c0b86e9
          envFrom:
            - configMapRef:
                name: prowlarr-configmap
          ports:
            - containerPort: 9696
              protocol: TCP
          # Sized from 7d observed usage (p95 192Mi, max 202Mi)
          resources:
            requests:
              cpu: "50m"
              memory: "192Mi"
            limits:
              memory: "384Mi"
          volumeMounts:
            - mountPath: /config
              name: prowlarr-config
              subPath: prowlarr/config

      restartPolicy: Always
      volumes:
        - name: prowlarr-config
          persistentVolumeClaim:
            claimName: prowlarr-config-pvc
