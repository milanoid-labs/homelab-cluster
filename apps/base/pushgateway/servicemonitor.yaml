---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: pushgateway
  labels:
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app: pushgateway
  endpoints:
    - port: metrics
      path: /metrics
      interval: 30s
      # Preserve job/instance labels set by pushing clients instead of
      # overwriting them with this scrape target's own job/instance.
      honorLabels: true
