---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pushgateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pushgateway
  template:
    metadata:
      labels:
        app: pushgateway
    spec:
      containers:
        - name: pushgateway
          image: prom/pushgateway:v1.11.3@sha256:f64c01c37761ae076fb4f550eb1253a35014ddda87fba4e2ec4f31de42c35c49
          ports:
            - containerPort: 9091
              name: metrics
          resources:
            requests:
              cpu: "10m"
              memory: "32Mi"
            limits:
              memory: "64Mi"
          securityContext:
            allowPrivilegeEscalation: false
            runAsUser: 65534  # nobody user baked into the image
