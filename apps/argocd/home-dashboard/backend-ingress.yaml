---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: home-dashboard-backend
spec:
  ingressClassName: traefik
  rules:
    # LAN/VPN only: the DNS record is an unproxied A record to a node IP, so
    # this hostname does not resolve usefully from the public internet.
    # Managed in milanoid-net-terraform (dns.tf, the `traefik` records map).
    - host: home-dashboard.milanoid.net
      http:
        paths:
          - backend:
              service:
                name: home-dashboard-backend
                port:
                  number: 8000
            path: /metrics
            pathType: Prefix
