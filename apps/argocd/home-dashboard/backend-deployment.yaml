---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: home-dashboard-backend
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: home-dashboard-backend
  template:
    metadata:
      labels:
        app: home-dashboard-backend
    spec:
      containers:
        - image: ghcr.io/milanoid-labs/home-dashboard-api:backend-v0.4.17@sha256:75ec3f581abf7bbb9b09ec6808691f15d58cd072255f9ec13ee999ab68ee2bfc
          name: home-dashboard-backend
          ports:
            - containerPort: 8001
          env:
            - name: SHC_URL
              value: "http://192.168.1.56"
            - name: SHC_USERNAME
              value: "admin"
            - name: SHC_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: home-dashboard-shc-credentials
                  key: password
          # These nodes are slow (AMD A8-8600B): the API took 43s to finish booting,
          # while liveness (initialDelaySeconds 10, 3 x 10s) killed it at ~40s — a race
          # the pod usually lost. startupProbe gives it 150s before liveness counts at all.
          startupProbe:
            httpGet:
              path: /health
              port: 8001
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8001
          livenessProbe:
            httpGet:
              path: /health
              port: 8001
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
