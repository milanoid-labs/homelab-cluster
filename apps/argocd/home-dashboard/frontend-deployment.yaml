---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: home-dashboard-frontend
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: home-dashboard-frontend
  template:
    metadata:
      labels:
        app: home-dashboard-frontend
    spec:
      containers:
        - image: ghcr.io/milanoid-labs/home-dashboard-web:frontend-v0.2.1
          name: home-dashboard-frontend
          ports:
            - containerPort: 8080
          env:
            - name: API_URL
              value: "http://home-dashboard-backend"
          # /health here reports on the *backend* too — it returns 503 whenever the API
          # is unreachable. So it can only drive readiness; using it for startup or
          # liveness restarts a perfectly healthy frontend whenever the backend is down,
          # which is how this pod racked up 247 restarts.
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 10
          # Process-liveness only: is Flask still accepting connections? Combined with the
          # startup budget below, this survives a long backend outage without restarting.
          startupProbe:
            tcpSocket:
              port: 8080
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            tcpSocket:
              port: 8080
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
