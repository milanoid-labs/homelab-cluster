---
apiVersion: v1
kind: Service
metadata:
  name: home-dashboard-backend
  labels:
    app: home-dashboard-backend
spec:
  ports:
    - port: 80
      name: home-dashboard-backend
      targetPort: 8001
    - port: 8000
      name: prometheus-metrics
      targetPort: 8000
  selector:
    app: home-dashboard-backend
