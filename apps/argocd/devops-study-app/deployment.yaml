---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-study-app
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: devops-study-app
  template:
    metadata:
      labels:
        app: devops-study-app
    spec:
      containers:
        - image: ghcr.io/milanoid-labs/study-app-api:backend-v0.2.6@sha256:fb9525ac0fad88ff39721dc79f11ecc5e99e7841eef2d2a4bb713e1bf690aa6f
          name: devops-study-app-backend
          ports:
            - containerPort: 22112
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
