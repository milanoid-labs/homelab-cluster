---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-study-app
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: devops-study-app
  template:
    metadata:
      labels:
        app: devops-study-app
    spec:
      containers:
        - image: ghcr.io/milanoid-labs/study-app-api:backend-v0.2.23@sha256:ea453eed8b4a21e6271beff28faa5231032e87f12d16eeba340e087725c55dec
          name: devops-study-app-backend
          ports:
            - containerPort: 22112
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
