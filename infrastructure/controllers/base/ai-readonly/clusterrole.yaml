---
# Read-only access for AI agents to everything except Secrets.
#
# The core ("") group is enumerated on purpose: resources: ["*"] there would grant
# secrets and nodes/proxy (GET on nodes/proxy allows exec into any pod via the
# kubelet websocket API). Never add secrets, */proxy, pods/exec, pods/attach or
# pods/portforward.
#
# Non-core groups use resources: ["*"] since they hold no Secrets. A new CRD
# group must be added to the list below to become readable.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ai-readonly
rules:
  - apiGroups: [""]
    resources:
      - componentstatuses
      - configmaps
      - endpoints
      - events
      - limitranges
      - namespaces
      - namespaces/status
      - nodes
      - nodes/status
      - persistentvolumeclaims
      - persistentvolumeclaims/status
      - persistentvolumes
      - pods
      - pods/log
      - pods/status
      - podtemplates
      - replicationcontrollers
      - replicationcontrollers/status
      - resourcequotas
      - resourcequotas/status
      - serviceaccounts
      - services
      - services/status
    verbs: [get, list, watch]
  - apiGroups:
      # Kubernetes
      - admissionregistration.k8s.io
      - apiextensions.k8s.io
      - apiregistration.k8s.io
      - apps
      - autoscaling
      - batch
      - certificates.k8s.io
      - coordination.k8s.io
      - discovery.k8s.io
      - events.k8s.io
      - flowcontrol.apiserver.k8s.io
      - gateway.networking.k8s.io
      - networking.k8s.io
      - node.k8s.io
      - policy
      - rbac.authorization.k8s.io
      - resource.k8s.io
      - scheduling.k8s.io
      - storage.k8s.io
      - storagemigration.k8s.io
      # K3s
      - helm.cattle.io
      - k3s.cattle.io
      - upgrade.cattle.io
      # Flux
      - helm.toolkit.fluxcd.io
      - kustomize.toolkit.fluxcd.io
      - notification.toolkit.fluxcd.io
      - source.toolkit.fluxcd.io
      # Add-ons
      - actions.github.com
      - argoproj.io
      - hub.traefik.io
      - monitoring.coreos.com
      - traefik.io
    resources: ["*"]
    verbs: [get, list, watch]
  - apiGroups: [metrics.k8s.io]
    resources: [nodes, pods]
    verbs: [get, list]
