---
# Long-lived token for the AI agent kubeconfig. Holds no data in git: the token
# controller populates it. Rotate by deleting the Secret (Flux recreates it) and
# regenerating ~/.kube/homelab-ai-readonly.yaml.
apiVersion: v1
kind: Secret
metadata:
  name: ai-readonly-token
  namespace: ai-readonly
  annotations:
    kubernetes.io/service-account.name: ai-readonly
type: kubernetes.io/service-account-token
