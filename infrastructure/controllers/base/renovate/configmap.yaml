---
apiVersion: v1
kind: ConfigMap
metadata:
  name: renovate-configmap
  namespace: renovate
data:
  RENOVATE_AUTODISCOVER: "false"
  RENOVATE_GIT_AUTHOR: "milanoid-renovate-bot[bot] <272032144+milanoid-renovate-bot[bot]@users.noreply.github.com>"
  RENOVATE_PLATFORM: "github"
  GITHUB_APP_ID: "3219089"
  GITHUB_INSTALLATION_ID: "119949905"
  LOG_LEVEL: "debug"
  # postUpgradeTasks a repo may run. kubevirt-scaleset: rewrites the SHA-256 pins next to the
  # versions Renovate bumps in vm-image/ (argument: the dependency's name).
  RENOVATE_ALLOWED_COMMANDS: '["^vm-image/update-checksums\\.sh [a-z/.-]+$"]'
