---
# Dynamic iSCSI LUNs on the Synology NAS, for workloads that can't live on NFS
# (SQLite, H2 and other file-based databases). ReadWriteOnce block volume, ext4.
# Retain: deleting a PVC leaves the LUN/target in DSM SAN Manager — clean up by hand.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: synology-iscsi
provisioner: csi.san.synology.com
parameters:
  dsm: "192.168.1.36"
  location: /volume1
  fsType: ext4
reclaimPolicy: Retain
allowVolumeExpansion: true
