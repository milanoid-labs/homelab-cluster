---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# KubeVirt v1.10.0. Built against k8s 1.36 libraries; the cluster runs 1.37, beyond what
# upstream lists (accepted, smoke-tested on v1.9.1; re-check after upgrading).
resources:
  - kubevirt-operator.yaml
  - kubevirt-cr.yaml
images:
  - name: quay.io/kubevirt/virt-operator
    newTag: v1.10.0
    digest: sha256:37c1287ad094eed25c4c6cc78744c06dd9bf340f7301eb0d26bdf3c4c230b738
patches:
  # virt-operator deploys the other components itself and derives their images from
  # VIRT_OPERATOR_IMAGE (a plain env string, which the images: transformer above doesn't
  # touch). Pin every component it starts by digest instead.
  - target:
      kind: Deployment
      name: virt-operator
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: virt-operator
      spec:
        template:
          spec:
            containers:
              - name: virt-operator
                env:
                  # Digest only, no tag: the operator parses this string, and with a tag@digest form
                  # it would derive "v1.10.0@sha256:<operator digest>" as the tag for components not
                  # pinned below (export proxy, sidecar shim, ...). Digest-only makes it fall back
                  # to KUBEVIRT_VERSION. The component images below are used verbatim.
                  - name: VIRT_OPERATOR_IMAGE
                    value: quay.io/kubevirt/virt-operator@sha256:37c1287ad094eed25c4c6cc78744c06dd9bf340f7301eb0d26bdf3c4c230b738
                  - name: VIRT_API_IMAGE
                    value: quay.io/kubevirt/virt-api:v1.10.0@sha256:876171a8625f7f20c337aba14d4ee4275923d612674c776fa25db5bf75901d5b
                  - name: VIRT_CONTROLLER_IMAGE
                    value: quay.io/kubevirt/virt-controller:v1.10.0@sha256:a3e588b9b88662153c29bc0c32f429b871880ff2a1aef6c01d83e69fc3d584ab
                  - name: VIRT_HANDLER_IMAGE
                    value: quay.io/kubevirt/virt-handler:v1.10.0@sha256:1cc169b352ea09ad25824f633b955b2692a5a284c15e9689bf393992b1c6d199
                  - name: VIRT_LAUNCHER_IMAGE
                    value: quay.io/kubevirt/virt-launcher:v1.10.0@sha256:e8ac130526a7ca76c93127cbe005e0c9d155361dfe3a16eaf8d3bb6fc8d659d1
                  # Also deployed by default (export proxy, template components) or started on
                  # demand (export server).
                  - name: VIRT_EXPORTPROXY_IMAGE
                    value: quay.io/kubevirt/virt-exportproxy:v1.10.0@sha256:ae0b9039f376cbb90445f20877a1a449b9dc5ffa7deeed3184a22e671e9c7fb2
                  - name: VIRT_EXPORTSERVER_IMAGE
                    value: quay.io/kubevirt/virt-exportserver:v1.10.0@sha256:394de63c4abc2c1ad894e6c9dce4685918aa0e7f1575242b2727750a9a395a6a
                  # virt-template-* has its own version line, and each KubeVirt release pins one
                  # minor of it (hack/virt-template/default.sh): v1.9 -> 0.2, v1.10 -> 0.3. The
                  # operator still applies that minor's CRDs/RBAC/webhooks and only swaps these
                  # images, so stay on its minor. renovate.json5 caps it; move the cap with the
                  # operator.
                  - name: VIRT_TEMPLATE_APISERVER_IMAGE
                    value: quay.io/kubevirt/virt-template-apiserver:v0.3.0@sha256:eaf118b2c1645c197f351c4aa0b56e49ace5c438530803b3ebcf390dc7b43731
                  - name: VIRT_TEMPLATE_CONTROLLER_IMAGE
                    value: quay.io/kubevirt/virt-template-controller:v0.3.0@sha256:5313fe9a7364881a8afd9ac3afb764fa7d009e098f4180417ed3708c5bdf2efc
  # virt-operator isn't placed by the CR (it isn't created by itself), so mirror
  # spec.infra.nodePlacement here: one replica on an ordinary worker, off the busy single
  # control plane that upstream's default requires.
  - target:
      kind: Deployment
      name: virt-operator
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
      - op: replace
        path: /spec/template/spec/affinity
        value:
          nodeAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              nodeSelectorTerms:
                - matchExpressions:
                    - key: node-role.kubernetes.io/worker
                      operator: Exists
                    - key: homelab.milanoid.net/kubevirt-runners
                      operator: DoesNotExist
