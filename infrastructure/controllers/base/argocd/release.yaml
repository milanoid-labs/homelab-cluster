---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: argocd
  namespace: argocd
spec:
  interval: 30m
  chart:
    spec:
      chart: argo-cd
      version: "9.7.1"
      sourceRef:
        kind: HelmRepository
        name: argo
        namespace: argocd
      interval: 12h
  install:
    crds: Create
  upgrade:
    crds: CreateReplace
  driftDetection:
    mode: enabled
  values:
    configs:
      cm:
        ui.bannercontent: "Hello Milanoid!"
        timeout.reconciliation: 180s
        statusbadge.enabled: "true"
        # Required by KSOPS: it is a kustomize exec (KRM) plugin, which is still alpha.
        kustomize.buildOptions: "--enable-alpha-plugins --enable-exec"
      params:
        server.insecure: true
    dex:
      enabled: false
    server:
      ingress:
        enabled: true
        ingressClassName: traefik
        hostname: argocd.milanoid.net
    # KSOPS gives ArgoCD native SOPS/age decryption, so ArgoCD-managed apps can keep
    # their secrets encrypted in this repo the same way the Flux-managed ones do.
    # The age key is the cluster's existing one, copied from flux-system/sops-age.
    repoServer:
      env:
        - name: XDG_CONFIG_HOME
          value: /.config
        - name: SOPS_AGE_KEY_FILE
          value: /.config/sops/age/keys.txt
      volumes:
        - name: custom-tools
          emptyDir: {}
        - name: sops-age
          secret:
            secretName: sops-age
      initContainers:
        # renovate: datasource=docker depName=viaductoss/ksops
        - name: install-ksops
          image: viaductoss/ksops:v4.5.1@sha256:4def9fdd4e2f850265740ebe9592c5455d19b76891e88e602df8b52d74b95334
          command: ["/usr/local/bin/ksops", "install", "--with-kustomize", "/custom-tools"]
          volumeMounts:
            - mountPath: /custom-tools
              name: custom-tools
      volumeMounts:
        - mountPath: /usr/local/bin/kustomize
          name: custom-tools
          subPath: kustomize
        - mountPath: /usr/local/bin/ksops
          name: custom-tools
          subPath: ksops
        - mountPath: /.config/sops/age
          name: sops-age
          readOnly: true
