---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: argocd
  namespace: argocd
spec:
  interval: 30m
  chart:
    spec:
      chart: argo-cd
      version: "10.17.2"
      sourceRef:
        kind: HelmRepository
        name: argo
        namespace: argocd
      interval: 12h
  install:
    crds: Create
  upgrade:
    crds: CreateReplace
  driftDetection:
    mode: enabled
  values:
    configs:
      cm:
        # Local account for the Hermes DevOps agent: API tokens only, no
        # interactive login. RBAC role bound in configs.rbac below.
        accounts.hermes: apiKey
        # Syncing to a revision other than the app's targetRevision requires the
        # `override` privilege (upstream-recommended; default flips in next major).
        application.sync.requireOverridePrivilegeForRevisionSync: "true"
        ui.bannercontent: "Hello Milanoid!"
        timeout.reconciliation: 180s
        statusbadge.enabled: "true"
        # Required by KSOPS: it is a kustomize exec (KRM) plugin, which is still alpha.
        kustomize.buildOptions: "--enable-alpha-plugins --enable-exec"
      rbac:
        # role:hermes — read apps/projects/clusters (app get/diff need the
        # project; cluster list/diff --local need clusters) and sync apps in
        # the default project.
        # Caveats:
        # - every app currently lives in `default`, so default/* means all apps
        #   (a dedicated AppProject would be the real boundary);
        # - sync can prune and also allows terminate-op on running syncs;
        # - app-of-apps is denied: syncing it can replace/cascade-delete the
        #   child Applications;
        # - logs scope is not isolation: the ai-readonly SA reads pods/log
        #   cluster-wide.
        # Deny wins over allow in Argo CD RBAC.
        policy.csv: |
          p, role:hermes, applications, get, */*, allow
          p, role:hermes, projects, get, *, allow
          p, role:hermes, clusters, get, *, allow
          p, role:hermes, applications, sync, default/*, allow
          p, role:hermes, applications, sync, default/app-of-apps, deny
          p, role:hermes, logs, get, default/*, allow
          g, hermes, role:hermes
      params:
        server.insecure: true
        # Reject API sync requests with Replace=true (kubectl replace --force);
        # no app here uses it. Resource-level annotations still apply.
        server.sync.replace.allowed: "false"
    dex:
      enabled: false
    server:
      ingress:
        enabled: true
        ingressClassName: traefik
        hostname: argocd.milanoid.net
    # KSOPS gives ArgoCD native SOPS/age decryption, so ArgoCD-managed apps can keep
    # their secrets encrypted in this repo the same way the Flux-managed ones do.
    # The age key is the cluster's existing one, copied from flux-system/sops-age.
    repoServer:
      env:
        - name: XDG_CONFIG_HOME
          value: /.config
        - name: SOPS_AGE_KEY_FILE
          value: /.config/sops/age/keys.txt
      volumes:
        - name: custom-tools
          emptyDir: {}
        - name: sops-age
          secret:
            secretName: sops-age
      initContainers:
        # renovate: datasource=docker depName=viaductoss/ksops
        - name: install-ksops
          image: viaductoss/ksops:v4.5.1@sha256:4def9fdd4e2f850265740ebe9592c5455d19b76891e88e602df8b52d74b95334
          command: ["/usr/local/bin/ksops", "install", "--with-kustomize", "/custom-tools"]
          volumeMounts:
            - mountPath: /custom-tools
              name: custom-tools
      volumeMounts:
        - mountPath: /usr/local/bin/kustomize
          name: custom-tools
          subPath: kustomize
        - mountPath: /usr/local/bin/ksops
          name: custom-tools
          subPath: ksops
        - mountPath: /.config/sops/age
          name: sops-age
          readOnly: true
