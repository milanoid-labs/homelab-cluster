---
# CloudNativePG operator. It only installs the CRDs (Cluster, Database, Pooler,
# ScheduledBackup, ...) and the controller; the Postgres clusters themselves are
# separate Cluster resources that it watches in every namespace.
#
# Chart is 0.x, so the Renovate pre-1.0 guard keeps bumps manual. An operator upgrade
# rolls every Postgres instance pod (new instance manager binary), so merge it when a
# short DB restart is acceptable.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cloudnative-pg
  namespace: cnpg-system
spec:
  interval: 30m
  chart:
    spec:
      chart: cloudnative-pg
      version: "0.29.1"
      sourceRef:
        kind: HelmRepository
        name: cnpg
        namespace: cnpg-system
      interval: 12h
  install:
    crds: Create
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  driftDetection:
    mode: enabled
  values:
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 512Mi
    monitoring:
      # Operator metrics (reconcile errors, etc.). kube-prometheus-stack only selects
      # monitors labelled with its release name.
      podMonitorEnabled: true
      podMonitorAdditionalLabels:
        release: kube-prometheus-stack
      # Upstream CloudNativePG dashboard. It shows the per-cluster cnpg_* metrics, so it
      # stays empty until a Cluster exists and is scraped.
      grafanaDashboard:
        create: true
        namespace: monitoring
        annotations:
          grafana_folder: Homelab
