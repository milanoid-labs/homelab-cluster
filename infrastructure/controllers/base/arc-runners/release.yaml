---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: homelab-runners
  namespace: arc-runners
spec:
  interval: 30m
  chart:
    spec:
      chart: gha-runner-scale-set
      version: "0.14.2"
      sourceRef:
        kind: HelmRepository
        name: actions-runner-controller
        namespace: arc-systems
      interval: 12h
  install:
    crds: Create
  upgrade:
    crds: CreateReplace
  driftDetection:
    mode: enabled
  values:
    githubConfigUrl: "https://github.com/milanoid-labs"
    githubConfigSecret: github-app
    minRunners: 1
    # Each runner pod can now burst to 4Gi (see the runner container below) and the
    # nodes are 7.3Gi / 11.4Gi allocatable, so keep the fan-out low enough that a
    # burst of concurrent agent jobs cannot push a node into memory pressure.
    maxRunners: 4
    template:
      spec:
        initContainers:
          - name: init-dind-externals
            image: ghcr.io/milanoid-labs/homelab-runner:20260724@sha256:9f9d5418dd04b2c363784de957a57fcd631f0ff739cedd3585425c35fb054141
            command: ["cp", "-r", "-v", "/home/runner/externals/.", "/home/runner/tmpDir/"]
            volumeMounts:
              - name: dind-externals
                mountPath: /home/runner/tmpDir
        containers:
          - name: runner
            image: ghcr.io/milanoid-labs/homelab-runner:20260724@sha256:9f9d5418dd04b2c363784de957a57fcd631f0ff739cedd3585425c35fb054141
            command: ["/home/runner/run.sh"]
            env:
              - name: DOCKER_HOST
                value: unix:///var/run/docker.sock
            # The plain CI jobs (yamllint, kubeconform, kube-linter) peak at 469Mi / 133m
            # over 7d of real runs, but the Copilot PR reviewer runs its whole agent in
            # this container -- Node 24, Playwright MCP, Autofind, git-proxy -- and was
            # cgroup-OOM-killed at the old 1Gi limit, which kills Runner.Listener and
            # surfaces on GitHub as "the self-hosted runner lost communication with the
            # server". 4Gi covers the agent; the request stays small so ordinary CI pods
            # still pack well.
            resources:
              requests:
                cpu: "100m"
                memory: "512Mi"
              limits:
                cpu: "1500m"
                memory: "4Gi"
            volumeMounts:
              - name: work
                mountPath: /home/runner/_work
              - name: dind-sock
                mountPath: /var/run
          - name: dind
            image: docker:29.6.2-dind@sha256:bfec1f5159c63a81ca6fdedbd81404d2c0e16378ed0feec3bb3fbf3998847659
            args:
              - dockerd
              - --host=unix:///var/run/docker.sock
              - --group=$(DOCKER_GROUP_GID)
            env:
              - name: DOCKER_GROUP_GID
                value: "123"
            # Sized from 7d of real CI runs: peak 178Mi / 27m. Kept at a 1Gi limit rather
            # than tighter because image builds run here and are burstier than observed.
            resources:
              requests:
                cpu: "50m"
                memory: "128Mi"
              limits:
                cpu: "1500m"
                memory: "1Gi"
            securityContext:
              privileged: true
            volumeMounts:
              - name: work
                mountPath: /home/runner/_work
              - name: dind-sock
                mountPath: /var/run
              - name: dind-externals
                mountPath: /home/runner/externals
        volumes:
          - name: work
            emptyDir: {}
          - name: dind-sock
            emptyDir: {}
          - name: dind-externals
            emptyDir: {}
