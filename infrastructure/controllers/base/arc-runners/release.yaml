---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: homelab-runners
  namespace: arc-runners
spec:
  interval: 30m
  # The controller deletes any AutoscalingRunnerSet whose version label differs from
  # its own, so the controller must finish upgrading before this chart is upgraded.
  dependsOn:
    - name: arc-controller
      namespace: arc-systems
  chart:
    spec:
      chart: gha-runner-scale-set
      version: "0.15.0"
      sourceRef:
        kind: HelmRepository
        name: actions-runner-controller
        namespace: arc-systems
      interval: 12h
  install:
    crds: Create
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  driftDetection:
    mode: enabled
  values:
    githubConfigUrl: "https://github.com/milanoid-labs"
    githubConfigSecret: github-app
    minRunners: 1
    maxRunners: 20 # was 8 with 2 nodes
    template:
      spec:
        initContainers:
          - name: init-dind-externals
            image: ghcr.io/milanoid-labs/homelab-runner:20261023@sha256:cb1c84316d610745aca992ef00c325c112602b36c8c76f2c6756741b4422bb3f
            command: ["cp", "-r", "-v", "/home/runner/externals/.", "/home/runner/tmpDir/"]
            volumeMounts:
              - name: dind-externals
                mountPath: /home/runner/tmpDir
        containers:
          - name: runner
            image: ghcr.io/milanoid-labs/homelab-runner:20261023@sha256:cb1c84316d610745aca992ef00c325c112602b36c8c76f2c6756741b4422bb3f
            command: ["/home/runner/run.sh"]
            env:
              - name: DOCKER_HOST
                value: unix:///var/run/docker.sock
            # The plain CI jobs (yamllint, kubeconform, kube-linter) peak at 469Mi / 133m
            # over 7d of real runs, but the Copilot PR reviewer runs its whole agent in
            # this container -- Node 24, Playwright MCP, Autofind, git-proxy -- and was
            # cgroup-OOM-killed at the old 1Gi limit, which kills Runner.Listener and
            # surfaces on GitHub as "the self-hosted runner lost communication with the
            # server". 4Gi covers the agent; the request stays small so ordinary CI pods
            # still pack well.
            resources:
              requests:
                cpu: "100m"
                memory: "512Mi"
              limits:
                cpu: "1500m"
                memory: "4Gi"
            volumeMounts:
              - name: work
                mountPath: /home/runner/_work
              - name: dind-sock
                mountPath: /var/run
          - name: dind
            image: docker:29.9.2-dind@sha256:9e79b879b177fbd72c34376a3dd3d91747da5db49e1f560f76aea59561471977
            args:
              - dockerd
              - --host=unix:///var/run/docker.sock
              - --group=$(DOCKER_GROUP_GID)
            env:
              - name: DOCKER_GROUP_GID
                value: "123"
            # Sized from 7d of real CI runs: peak 178Mi / 27m. Kept at a 1Gi limit rather
            # than tighter because image builds run here and are burstier than observed.
            resources:
              requests:
                cpu: "50m"
                memory: "128Mi"
              limits:
                cpu: "1500m"
                memory: "1Gi"
            securityContext:
              privileged: true
            volumeMounts:
              - name: work
                mountPath: /home/runner/_work
              - name: dind-sock
                mountPath: /var/run
              - name: dind-externals
                mountPath: /home/runner/externals
        volumes:
          - name: work
            emptyDir: {}
          - name: dind-sock
            emptyDir: {}
          - name: dind-externals
            emptyDir: {}
