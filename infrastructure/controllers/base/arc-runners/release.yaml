---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: homelab-runners
  namespace: arc-runners
spec:
  interval: 30m
  # The controller deletes any AutoscalingRunnerSet whose version label differs from
  # its own, so the controller must finish upgrading before this chart is upgraded.
  dependsOn:
    - name: arc-controller
      namespace: arc-systems
  chart:
    spec:
      chart: gha-runner-scale-set
      version: "0.15.0"
      sourceRef:
        kind: HelmRepository
        name: actions-runner-controller
        namespace: arc-systems
      interval: 12h
  install:
    crds: Create
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  driftDetection:
    mode: enabled
  values:
    githubConfigUrl: "https://github.com/milanoid-labs"
    githubConfigSecret: github-app
    minRunners: 1
    # Each runner pod can now burst to 4Gi (see the runner container below) and the
    # nodes are 7.3Gi / 11.4Gi allocatable, so keep the fan-out low enough that a
    # burst of concurrent agent jobs cannot push a node into memory pressure.
    maxRunners: 8
    template:
      spec:
        initContainers:
          - name: init-dind-externals
            image: ghcr.io/milanoid-labs/homelab-runner:20261002@sha256:354bed8650291cde8cef7a89650e9aa90a6e4e00dcbf7746eb037d6c81c08ca7
            command: ["cp", "-r", "-v", "/home/runner/externals/.", "/home/runner/tmpDir/"]
            volumeMounts:
              - name: dind-externals
                mountPath: /home/runner/tmpDir
        containers:
          - name: runner
            image: ghcr.io/milanoid-labs/homelab-runner:20261002@sha256:354bed8650291cde8cef7a89650e9aa90a6e4e00dcbf7746eb037d6c81c08ca7
            command: ["/home/runner/run.sh"]
            env:
              - name: DOCKER_HOST
                value: unix:///var/run/docker.sock
            # The plain CI jobs (yamllint, kubeconform, kube-linter) peak at 469Mi / 133m
            # over 7d of real runs, but the Copilot PR reviewer runs its whole agent in
            # this container -- Node 24, Playwright MCP, Autofind, git-proxy -- and was
            # cgroup-OOM-killed at the old 1Gi limit, which kills Runner.Listener and
            # surfaces on GitHub as "the self-hosted runner lost communication with the
            # server". 4Gi covers the agent; the request stays small so ordinary CI pods
            # still pack well.
            resources:
              requests:
                cpu: "100m"
                memory: "512Mi"
              limits:
                cpu: "1500m"
                memory: "4Gi"
            volumeMounts:
              - name: work
                mountPath: /home/runner/_work
              - name: dind-sock
                mountPath: /var/run
          - name: dind
            image: docker:29.8.2-dind@sha256:1e08cdb63405ca788aea94ef35b792d1e299607c667d33d7bcbcae1fd2611ced
            args:
              - dockerd
              - --host=unix:///var/run/docker.sock
              - --group=$(DOCKER_GROUP_GID)
            env:
              - name: DOCKER_GROUP_GID
                value: "123"
            # Sized from 7d of real CI runs: peak 178Mi / 27m. Kept at a 1Gi limit rather
            # than tighter because image builds run here and are burstier than observed.
            resources:
              requests:
                cpu: "50m"
                memory: "128Mi"
              limits:
                cpu: "1500m"
                memory: "1Gi"
            securityContext:
              privileged: true
            volumeMounts:
              - name: work
                mountPath: /home/runner/_work
              - name: dind-sock
                mountPath: /var/run
              - name: dind-externals
                mountPath: /home/runner/externals
        volumes:
          - name: work
            emptyDir: {}
          - name: dind-sock
            emptyDir: {}
          - name: dind-externals
            emptyDir: {}
