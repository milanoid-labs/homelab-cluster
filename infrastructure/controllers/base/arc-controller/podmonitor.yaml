---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: arc-controller
  namespace: arc-systems
  labels:
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app.kubernetes.io/component: controller-manager
      app.kubernetes.io/part-of: gha-rs-controller
  podMetricsEndpoints:
    - port: metrics
      path: /metrics
      interval: 30s
---
# The chart creates no Service for listeners; the controller spawns one listener pod per
# runner scale set in this namespace. Its container port is set by the controller's Go
# code, not the chart, so match it by number rather than by name.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: arc-listener
  namespace: arc-systems
  labels:
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app.kubernetes.io/component: runner-scale-set-listener
  podMetricsEndpoints:
    - portNumber: 8080
      path: /metrics
      interval: 30s
