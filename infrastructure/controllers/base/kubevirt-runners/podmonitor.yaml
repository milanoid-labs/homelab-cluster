---
# gha_* (ARC-compatible, name="homelab-runners-vm") and kubevirt_scaleset_* metrics.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: kubevirt-scaleset
  namespace: kubevirt-runners
  labels:
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: kubevirt-scaleset
  podMetricsEndpoints:
    - port: metrics
      path: /metrics
      interval: 30s
      # Same `scale_set` label the arc-listener PodMonitor adds, so one dashboard
      # variable covers both pools. Taken from the pod label the scaler also reads its
      # SCALE_SET_NAME from, so it can't drift from the `name` label of its metrics.
      relabelings:
        - sourceLabels: [__meta_kubernetes_pod_label_homelab_milanoid_net_scale_set]
          targetLabel: scale_set
