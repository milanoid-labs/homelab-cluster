name: Build Runner Image

on:
  push:
    branches: [main]
    paths:
      - 'runner/Dockerfile'
      - 'scripts/runner-base-image.sh'
      - '.github/workflows/build-runner-image.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: homelab-runners
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Resolve upstream actions-runner base image
        id: base
        run: bash scripts/runner-base-image.sh runner/Dockerfile >> "$GITHUB_OUTPUT"

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/milanoid-labs/homelab-runner
          tags: |
            type=sha,prefix=
            type=raw,value=latest
            type=raw,value={{date 'YYYYMMDD'}}

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: runner
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          # metadata-action's labels: input replaces its whole default template, so we
          # keep its defaults and append ours; for duplicate keys the last --label wins,
          # letting title/description override the repo-derived defaults. base.* are the
          # OCI-spec keys recording the upstream runner image we are built on.
          labels: |
            ${{ steps.meta.outputs.labels }}
            org.opencontainers.image.title=homelab-runner
            org.opencontainers.image.description=Self-hosted GitHub Actions runner image for ARC in homelab-cluster. Built on ${{ steps.base.outputs.base_name }} plus gh CLI and dirmngr.
            org.opencontainers.image.base.name=${{ steps.base.outputs.base_name }}
            org.opencontainers.image.base.digest=${{ steps.base.outputs.base_digest }}
