---
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  yaml-lint:
    name: YAML Lint
    runs-on: homelab-runners
    container: pipelinecomponents/yamllint:latest@sha256:5ab5eb7da0ed5e606b07c1723fc8b275e925189f70ac259b26b7329cb5f8f44d
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Run yamllint
        run: yamllint -c .yamllint.yaml .
      - name: Push metrics to Pushgateway
        if: always()
        continue-on-error: true
        run: |
          apk add --no-cache curl
          cat <<EOF | curl --silent --show-error --fail --max-time 10 -X PUT --data-binary @- \
            http://pushgateway.pushgateway.svc.cluster.local:9091/metrics/job/ci/instance/yaml-lint
          # TYPE github_actions_job_success gauge
          github_actions_job_success ${{ job.status == 'success' && '1' || '0' }}
          # TYPE github_actions_job_last_run_timestamp_seconds gauge
          github_actions_job_last_run_timestamp_seconds $(date +%s)
          EOF

  kubeconform:
    name: Kubeconform
    runs-on: homelab-runners
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install kustomize and kubeconform
        run: |
          KUSTOMIZE_VERSION="5.6.0"
          KUBECONFORM_VERSION="0.6.7"
          curl -sL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv${KUSTOMIZE_VERSION}/kustomize_v${KUSTOMIZE_VERSION}_linux_amd64.tar.gz" | tar xz
          sudo mv kustomize /usr/local/bin/
          curl -sL "https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" | tar xz
          sudo mv kubeconform /usr/local/bin/
      - name: Validate kustomize overlays
        run: |
          set -euo pipefail
          build_file="$(mktemp /tmp/build-XXXXXX.yaml)"
          trap 'rm -f "$build_file"' EXIT
          for overlay in \
            apps/staging \
            infrastructure/controllers/staging \
            infrastructure/k3s-upgrade-plans \
            monitoring/controllers/staging \
            monitoring/configs/staging \
            persistent-volumes/staging \
            workflows/staging; do
            echo "--- Validating $overlay ---"
            # kubeconform mis-splits very large multi-doc YAML (e.g. Argo Workflows CRDs)
            # when reading from stdin, so build to a temp file and pass that instead.
            kustomize build --load-restrictor LoadRestrictionsNone "$overlay" > "$build_file"
            kubeconform \
              --ignore-missing-schemas \
              --kubernetes-version 1.34.0 \
              --summary \
              "$build_file"
          done
      - name: Push metrics to Pushgateway
        if: always()
        continue-on-error: true
        run: |
          cat <<EOF | curl --silent --show-error --fail --max-time 10 -X PUT --data-binary @- \
            http://pushgateway.pushgateway.svc.cluster.local:9091/metrics/job/ci/instance/kubeconform
          # TYPE github_actions_job_success gauge
          github_actions_job_success ${{ job.status == 'success' && '1' || '0' }}
          # TYPE github_actions_job_last_run_timestamp_seconds gauge
          github_actions_job_last_run_timestamp_seconds $(date +%s)
          EOF

  k3s-plan-consistency:
    name: K3s Plan Consistency
    runs-on: homelab-runners
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Check k3s upgrade Plans
        run: |
          set -euo pipefail
          plans="infrastructure/k3s-upgrade-plans/plans.yaml"
          status=0

          # system-upgrade-controller derives the upgrade image tag from spec.version.
          # A tag or digest here overrides that and silently pins the k3s binary that
          # gets installed, so the Job can "succeed" while installing the old version.
          if grep -nE '^[[:space:]]*image:[[:space:]]*rancher/k3s-upgrade[:@]' "$plans"; then
            echo "::error file=$plans::rancher/k3s-upgrade must stay untagged so system-upgrade-controller derives the tag from spec.version"
            status=1
          fi

          # All Plans must target the same k3s release, in the canonical +k3sN form.
          versions="$(grep -E '^[[:space:]]*version:[[:space:]]*v' "$plans" | awk '{print $2}' | sort -u)"
          if [ "$(echo "$versions" | wc -l)" -ne 1 ]; then
            echo "::error file=$plans::Plans disagree on spec.version: $(echo "$versions" | tr '\n' ' ')"
            status=1
          fi
          if ! echo "$versions" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+\+k3s[0-9]+$'; then
            echo "::error file=$plans::spec.version must look like vX.Y.Z+k3sN, got: $versions"
            status=1
          fi

          exit $status
      - name: Push metrics to Pushgateway
        if: always()
        continue-on-error: true
        run: |
          cat <<EOF | curl --silent --show-error --fail --max-time 10 -X PUT --data-binary @- \
            http://pushgateway.pushgateway.svc.cluster.local:9091/metrics/job/ci/instance/k3s-plan-consistency
          # TYPE github_actions_job_success gauge
          github_actions_job_success ${{ job.status == 'success' && '1' || '0' }}
          # TYPE github_actions_job_last_run_timestamp_seconds gauge
          github_actions_job_last_run_timestamp_seconds $(date +%s)
          EOF

  kube-linter:
    name: Kube Linter
    runs-on: homelab-runners
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Run kube-linter
        uses: stackrox/kube-linter-action@87802a2f4e01abebb3ee3c67a3002fea71f6eae5 # v1
        with:
          directory: .
          config: .kube-linter.yaml
      - name: Push metrics to Pushgateway
        if: always()
        continue-on-error: true
        run: |
          cat <<EOF | curl --silent --show-error --fail --max-time 10 -X PUT --data-binary @- \
            http://pushgateway.pushgateway.svc.cluster.local:9091/metrics/job/ci/instance/kube-linter
          # TYPE github_actions_job_success gauge
          github_actions_job_success ${{ job.status == 'success' && '1' || '0' }}
          # TYPE github_actions_job_last_run_timestamp_seconds gauge
          github_actions_job_last_run_timestamp_seconds $(date +%s)
          EOF
